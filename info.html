<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes da Espécie</title>
    <link rel="stylesheet" href="stylesinfo.css">

    <style>
        .image-wrapper {
            text-align: center;
            margin-bottom: 15px;
        }
        
        #animal-image {
            max-width: 260px;
            border-radius: 12px;
            border: 4px solid #2ecc71;
        }
        
        .creditos-imagem {
            color: #ffffff;
            font-size: 14px;
            margin-bottom: 10px;
            text-align: center;
            opacity: 0.9;
        }
        
        .creditos-imagem span {
            margin: 0 4px;
        }
        
        .image-credit span {
            margin: 0 4px;
        }
    </style>

</head>

<body>

    <div class="container" role="main">
        <div class="modal">

            <div class="modal-header">
                <h2 id="animal-name"></h2>
            </div>

            <div class="modal-body">

                <div class="creditos-imagem">
                    <span id="img-autor"></span> |
                    <span id="img-fonte"></span> |
                    <span id="img-licenca"></span>
                </div>

                <img id="animal-image" alt="Imagem do Animal">
                <div class="details1">

                    <div class="detail-card">
                        <h5>Nomes conhecidos</h5>
                        <p id="known-names"></p>
                    </div>

                    <div class="detail-card">
                        <h5>Nome científico</h5>
                        <p id="scientific-name"></p>
                    </div>

                    <div class="detail-card">
                        <h5>Família</h5>
                        <p id="family"></p>
                    </div>

                    <div class="detail-card">
                        <h5>Alimentação</h5>
                        <p id="food"></p>
                    </div>

                    <div class="detail-card">
                        <h5>Ordem</h5>
                        <p id="order"></p>
                    </div>

                </div>

                <div class="details2">

                    <div class="detail-card">
                        <h5>Hábitos</h5>
                        <p id="habits"></p>
                    </div>

                    <div class="detail-card">
                        <h5>Divisão</h5>
                        <p id="division"></p>
                    </div>

                    <div class="detail-card">
                        <h5>Curiosidades</h5>
                        <p id="curiosities"></p>
                    </div>

                    <div class="detail-card">
                        <h5>Habitat</h5>
                        <p id="habitat"></p>
                    </div>

                    <div class="detail-card">
                        <h5>Distribuição geográfica</h5>
                        <p id="geographic-distribution"></p>
                    </div>

                </div>

            </div>

            <div class="modal-footer">
                <button type="button" id="btn-voltar">Voltar</button>
            </div>

        </div>
    </div>

    <script src="info.js"></script>

    <!-- VLibras: traduz o conteudo da pagina para Libras (widget oficial do governo) -->
    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script src="vlibras-init.js"></script>

</body>

</html>
