<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Animal</title>
    <link rel="stylesheet" href="stylesinfo.css">
</head>
<body>
    <div class="container">
        <div class="modal">
            <div class="modal-header">
                <h2 id="animal-name"></h2>
            </div>
            <div class="modal-body">
                <img id="animal-image" src="" alt="Imagem do Animal">
                <div class="details1">
                    <div class="detail-card"><h5>Nomes conhecidos</h5><p id="known-names"></p></div>
                    <div class="detail-card"><h5>Nome científico</h5><p id="scientific-name"></p></div>
                    <div class="detail-card"><h5>Família</h5><p id="family"></p></div>
                    <div class="detail-card"><h5>Alimentação</h5><p id="food"></p></div>
                    <div class="detail-card"><h5>Ordem</h5><p id="order"></p></div>
                  </div>
                  <div class="details2">
                    <div class="detail-card"><h5>Hábitos</h5><p id="habits"></p></div>
                    <div class="detail-card"><h5>Divisão</h5><p id="division"></p></div>
                    <div class="detail-card"><h5>Curiosidades</h5><p id="curiosities"></p></div>
                    <div class="detail-card"><h5>Habitat</h5><p id="habitat"></p></div>
                    <div class="detail-card"><h5>Distribuição geográfica</h5><p id="geographic-distribution"></p></div>
                </div>
            </div>
            <div class="modal-footer">
                <button onclick="goBack()">Voltar</button>
            </div>
        </div>
    </div>

    <script>
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        document.getElementById('animal-name').innerText = getQueryParam('name');
        document.getElementById('animal-image').src = getQueryParam('image_url');
        document.getElementById('known-names').innerText = getQueryParam('known_names');
        document.getElementById('scientific-name').innerText = getQueryParam('scientific_name');
        document.getElementById('family').innerText = getQueryParam('family');
        document.getElementById('food').innerText = getQueryParam('food');
        document.getElementById('order').innerText = getQueryParam('order');
        document.getElementById('habits').innerText = getQueryParam('habits');
        document.getElementById('division').innerText = getQueryParam('division');
        document.getElementById('curiosities').innerText = getQueryParam('curiosities');
        document.getElementById('habitat').innerText = getQueryParam('habitat');
        document.getElementById('geographic-distribution').innerText = getQueryParam('geographic_distribution');

        function goBack() {
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
